<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#003cb4" />
    <meta
      name="description"
      content="三安光电 AI 费用预决算管理系统 · 交互式产品 Demo"
    />
    <title>三安光电 AI 费用预决算管理系统 · DEMO</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/brand.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/v02.css" />
    <link rel="stylesheet" href="styles/v04.css" />
    <link rel="stylesheet" href="styles/views.css" />
    <link rel="stylesheet" href="styles/motion.css" />
  </head>
  <body>
    <!-- 登录页 -->
    <div id="loginRoot" class="login-root"></div>

    <!-- 主界面 -->
    <div id="appRoot" class="app-root" style="display: none; flex-direction: column; height: 100%">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" role="img" aria-label="Sanan 三安制造"></div>
          <div class="brand-text">
            <div class="brand-title">三安光电 AI 费用预决算管理系统</div>
            <div class="brand-sub">San'an Optoelectronics · AI Budget Management</div>
          </div>
        </div>
        <nav class="quicknav" id="quicknav"></nav>
        <div class="topbar-right">
          <span class="role-label" id="roleLabel">未登录</span>
          <button class="btn btn-ghost bell-btn" id="bellBtn" title="消息通知">
            <span class="bell-ico">🔔</span><span class="bell-badge" id="bellBadge" hidden>0</span>
          </button>
          <button class="btn btn-ghost" id="logoutBtn">退出登录</button>
        </div>
      </header>

      <main class="layout">
        <!-- 左侧：AI Copilot 常驻 -->
        <section class="copilot-panel">
          <div class="copilot-head">
            <div class="copilot-head-info">
              <div class="copilot-title">AI Budget Copilot</div>
              <div class="copilot-sub">对话式智能预算助手 · 所有结论均可追溯证据</div>
            </div>
          </div>
          <div class="chat" id="chat"></div>
          <div class="composer">
            <textarea
              id="chatInput"
              rows="1"
              placeholder="直接提问，例如：哪个部门今年最容易超预算？"
              autocomplete="off"
            ></textarea>
            <button class="btn btn-primary" id="sendBtn">发送</button>
          </div>
        </section>

        <!-- 右侧：工作台内容区 -->
        <section class="view-panel" id="viewPanel"></section>
      </main>
    </div>

    <div id="modalRoot"></div>
    <div class="toast-stack" id="toastRoot" aria-live="polite"></div>

    <script src="data/data.js"></script>
    <script src="core/utils.js"></script>
    <script src="core/state.js"></script>
    <script src="core/api.js"></script>
    <script src="core/engine.js"></script>
    <script src="core/calc.js"></script>
    <script src="core/role-hint.js"></script>
    <script src="views/copilot.js"></script>
    <script src="views/dashboard.js"></script>
    <script src="views/details.js"></script>
    <script src="views/approval.js"></script>
    <script src="views/decisions.js"></script>
    <script src="views/projects.js"></script>
    <script src="views/adjust.js"></script>
    <script src="views/rules.js"></script>
    <script src="views/basedata.js"></script>
    <script src="views/orgchart.js"></script>
    <script src="views/login.js"></script>
    <script src="views/workbench.js"></script>
    <script src="views/plan.js"></script>
    <script src="views/track.js"></script>
    <script src="views/final.js"></script>
    <script src="views/benchmark.js"></script>
    <script src="views/collision.js"></script>
    <script src="views/collision-tune.js"></script>
    <script src="views/tune.js"></script>
    <script src="views/compile.js"></script>
    <script src="views/balance.js"></script>
    <script src="views/monthly-split.js"></script>
    <script src="views/unit-inbox.js"></script>
    <script src="views/unit-summary.js"></script>
    <script src="views/final-risk.js"></script>
    <script src="views/accounts.js"></script>
    <script src="views/import-view.js"></script>
    <script src="views/risk-view.js"></script>
    <script src="views/kanban.js"></script>
    <script src="views/ai-config.js"></script>
    <script src="views/roleSwitch.js"></script>
    <script src="app.js"></script>
  </body>
</html>
