<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#003cb4" />
    <meta name="description" content="三安光电 AI 费用预决算管理系统 · 手机版 Demo" />
    <title>三安光电 AI 费用预决算 · 手机版</title>
    <link rel="stylesheet" href="styles/mobile.css" />
  </head>
  <body>
    <!-- 登录页 -->
    <div id="loginRoot" class="login-root"></div>

    <!-- 主界面 -->
    <div id="appRoot" class="app-root" style="display: none">
      <!-- 顶部栏 -->
      <header class="topbar">
        <div class="topbar-brand">
          <div class="brand-mark" role="img" aria-label="Sanan 三安制造"></div>
          <div>
            <div class="brand-title" id="pageTitle">工作台</div>
            <div class="brand-sub" id="pageSub"></div>
          </div>
        </div>
        <div class="topbar-actions">
          <span class="role-chip" id="roleLabel">未登录</span>
          <button class="icon-btn" id="switchRoleBtn" title="切换角色">⇄</button>
          <button class="icon-btn" id="resetBtn" title="重置">↺</button>
        </div>
      </header>

      <!-- 内容区 -->
      <main class="content" id="content"></main>

      <!-- 底部 Tab -->
      <nav class="tabbar" id="tabbar">
        <button class="tab-btn active" data-tab="home"><span class="tab-ico">⌂</span><span class="tab-label">首页</span></button>
        <button class="tab-btn" data-tab="budget"><span class="tab-ico">◫</span><span class="tab-label">预算</span></button>
        <button class="tab-btn" data-tab="approval"><span class="tab-ico">✓</span><span class="tab-label">审批</span></button>
        <button class="tab-btn" data-tab="copilot"><span class="tab-ico">✦</span><span class="tab-label">AI 助手</span></button>
      </nav>
    </div>

    <div class="modal-mask" id="modalMask" style="display: none"></div>
    <div class="modal-sheet" id="modalSheet" style="display: none"></div>
    <div class="toast-stack" id="toastRoot" aria-live="polite"></div>

    <script src="data/data.js"></script>
    <script src="../core/utils.js"></script>
    <script src="../core/calc.js"></script>
    <script src="core/state.js"></script>
    <script src="../core/api.js"></script>
    <!-- engine.js 与 desktop 完全一致，复用共享内核，避免第三份漂移 -->
    <script src="../core/engine.js"></script>
    <script src="views/home.js"></script>
    <script src="views/budget.js"></script>
    <script src="views/approval.js"></script>
    <script src="views/copilot.js"></script>
    <script src="views/login.js"></script>
    <script src="app.js"></script>
  </body>
</html>
